[project]
name = "PySide QtQuick Project"
dependencies = ["PySide6", "httpx", "qasync"]

[tool.pyside6-project]
files = [
    "main.py",
    "api_client.py",
    "manzanillo/Main.qml",
    "manzanillo/ContainersPage.qml",
    "manzanillo/ImagesPage.qml",
    "manzanillo/VolumesPage.qml",
    "manzanillo/SettingsPage.qml",
    "manzanillo/qmldir",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
qt_api = "pyside6"
